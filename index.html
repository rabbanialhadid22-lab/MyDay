<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4fafa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MyDay">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>MyDay</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="icon-512.png" alt="">
    <div class="serif splash-name">MyDay</div>
  </div>

  <header class="topbar">
    <div class="brand"><img src="icon-192.png" alt="" width="32" height="32"><span class="serif">MyDay</span></div>
    <button id="hdr-sync" class="chip" type="button" title="Google Kalender"></button>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="bottomnav" id="nav" aria-label="Menu utama">
    <button data-tab="today" class="active" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.2"/><path d="M8 3v4M16 3v4M3.5 10.2h17"/></svg>
      <span>Hari Ini</span>
    </button>
    <button data-tab="quran" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.2A2.7 2.7 0 0 1 7.7 2.5H19v15.8H7.7A2.7 2.7 0 0 0 5 21z"/><path d="M5 5.2V21M9 7h6"/></svg>
      <span>Al-Qur'an</span>
    </button>
    <button data-tab="money" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13.5" rx="3.2"/><path d="M3 10.5h18"/><circle cx="16.6" cy="15" r="1.1" fill="currentColor" stroke="none"/></svg>
      <span>Keuangan</span>
    </button>
    <button data-tab="more" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
      <span>Lainnya</span>
    </button>
  </nav>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
